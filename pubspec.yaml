name: tutorly
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  firebase_core: ^3.12.1
  cupertino_icons: ^1.0.8
  cloud_firestore: ^5.6.5
  firebase_auth: ^5.5.1  # Usa la última versión estable disponible
  country_picker: ^2.0.20  # Usa la última versión estable disponible
  google_fonts: ^6.2.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/image.png
    - assets/circle.png
    - assets/logo.png
    - assets/stress.png
    - assets/lesson.png
    - assets/men.png
    - assets/userwomen.jpg
